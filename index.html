<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>航空特殊無線技士 試験対策ドリル</title>
<style>
:root{
  --bg:#0d1726; --panel:#152238; --panel2:#1c2c47; --line:#2a3d5e;
  --text:#e8eef7; --sub:#9db0cc;
  --amber:#f5b93c; --cyan:#3fd6e0; --green:#4ade80; --red:#f87171;
}
:root[data-theme="light"], :root:not([data-theme="dark"]){ }
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,system-ui,sans-serif;line-height:1.6;min-height:100vh}
.wrap{max-width:640px;margin:0 auto;padding:16px 14px 48px}
header{display:flex;align-items:baseline;gap:10px;border-bottom:2px solid var(--amber);padding:14px 2px 10px;margin-bottom:16px}
header .logo{font-size:20px;color:var(--amber)}
header h1{font-size:17px;font-weight:700;letter-spacing:.03em}
header .sub{font-size:11px;color:var(--sub);margin-left:auto}
h2{font-size:15px;color:var(--cyan);margin:20px 0 10px;letter-spacing:.04em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
button{font-family:inherit;cursor:pointer;border:none;border-radius:10px;font-size:14px}
.menu-btn{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:14px;margin-bottom:8px;text-align:left;border-radius:12px}
.menu-btn:active{background:var(--panel2)}
.menu-btn .arrow{color:var(--amber)}
.menu-btn small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.unit-btn{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:12px 14px;margin-bottom:6px;text-align:left;border-radius:10px;display:flex;justify-content:space-between}
.unit-btn span.n{color:var(--sub);font-size:12px}
.primary{background:var(--amber);color:#1a1a10;font-weight:700;padding:12px 18px;width:100%}
.secondary{background:var(--panel2);color:var(--cyan);border:1px solid var(--cyan);padding:11px 16px;width:100%}
.ghost{background:none;color:var(--sub);padding:10px;width:100%;font-size:13px}
.back{background:none;color:var(--sub);font-size:13px;padding:6px 0;margin-bottom:10px}
.avatar{margin-left:auto;width:36px;height:36px;border-radius:50%;background:var(--panel2);border:1px solid var(--cyan);color:var(--text);font-size:16px;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:19px;line-height:1.3}
.tile b{font-size:14px;font-weight:700}
.tile small{color:var(--sub);font-size:11px}
.tile:active{background:var(--panel2)}
.links{margin-top:12px;font-size:12px;color:var(--sub);text-align:center}
.links a{color:var(--amber)}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-bottom:8px}
.qtext{font-size:15px;font-weight:600;margin-bottom:14px;white-space:pre-wrap}
.opt{display:block;width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:12px;margin-bottom:8px;text-align:left;border-radius:10px;font-size:14px;line-height:1.5}
.opt.correct{border-color:var(--green);background:rgba(74,222,128,.12)}
.opt.wrong{border-color:var(--red);background:rgba(248,113,113,.12)}
.opt:disabled{opacity:1;cursor:default}
.verdict{font-weight:700;font-size:15px;margin:6px 0}
.verdict.ok{color:var(--green)} .verdict.ng{color:var(--red)}
.expl{background:var(--panel2);border-left:3px solid var(--cyan);border-radius:6px;padding:10px 12px;font-size:13px;color:var(--text);margin:8px 0 12px;white-space:pre-wrap}
.score-big{font-size:34px;font-weight:800;text-align:center;margin:8px 0}
.pass{color:var(--green);text-align:center;font-weight:700;font-size:16px}
.fail{color:var(--red);text-align:center;font-weight:700;font-size:16px}
.bar{height:8px;background:var(--panel2);border-radius:4px;overflow:hidden;margin:10px 0}
.bar i{display:block;height:100%;background:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left}
th{color:var(--sub);font-weight:600;font-size:11px}
.ph-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ph-cell{background:var(--panel2);border-radius:8px;padding:8px 10px;font-size:13px}
.ph-cell b{color:var(--amber);font-size:15px;margin-right:8px}
.big-letters{font-size:30px;letter-spacing:.35em;text-align:center;font-weight:800;color:var(--amber);margin:14px 0;word-break:break-all}
input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px;font-size:18px;letter-spacing:.2em;text-transform:uppercase;font-family:inherit}
.row{display:flex;gap:8px;margin:8px 0}
.row>*{flex:1}
select{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px;font-family:inherit;width:100%}
label.f{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
.diff-ok{color:var(--green);font-weight:700}
.diff-ng{color:var(--red);font-weight:700;text-decoration:underline}
.note{font-size:12px;color:var(--sub);margin-top:8px}
.tag{display:inline-block;background:var(--panel2);color:var(--cyan);border-radius:6px;font-size:11px;padding:2px 8px;margin-right:6px}
</style>
</head>
<body>
<div class="wrap">
<header><span class="logo">✈</span><h1>航空特殊無線技士ドリル</h1><button class="avatar" onclick="profile()" aria-label="マイページ">👤</button></header>
<div id="app"></div>
</div>

const $=id=>document.getElementById(id);
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

let quiz=null;
function startQuiz(idxList,title,mode){
  quiz={list:shuf(idxList),i:0,ok:0,okLaw:0,okEng:0,title,mode,wrongNow:[]};
  renderQ();
}
function renderQ(){
  const qi=quiz.list[quiz.i], q=Q[qi];
  const opts=shuf(q[2].map((t,k)=>({t,correct:k===0})));
  app.innerHTML=`
  <button class="back" onclick="confirmQuit()">← 中断してホームへ</button>
  <div class="qmeta"><span>${esc(quiz.title)}</span><span>${quiz.i+1} / ${quiz.list.length}問</span></div>
  <div class="bar"><i style="width:${(quiz.i)/quiz.list.length*100}%"></i></div>
  <div class="card">
    <div class="qmeta"><span class="tag">${esc(UNITS[q[0]])}</span></div>
    <div class="qtext">${esc(q[1])}</div>
    <div id="opts">${opts.map((o,k)=>`<button class="opt" data-c="${o.correct?1:0}" onclick="answer(this)">${k+1}. ${esc(o.t)}</button>`).join("")}</div>
    <div id="fb"></div>
  </div>`;
}
function answer(btn){
  const qi=quiz.list[quiz.i], q=Q[qi], correct=btn.dataset.c==="1";
  document.querySelectorAll("#opts .opt").forEach(b=>{b.disabled=true;if(b.dataset.c==="1")b.classList.add("correct")});
  if(!correct)btn.classList.add("wrong");
  if(correct){quiz.ok++;if(LAW_UNITS.includes(q[0]))quiz.okLaw++;else quiz.okEng++;wrongSet.delete(qi)}
  else{quiz.wrongNow.push(qi);wrongSet.add(qi)}
  save(WKEY,[...wrongSet]);
  $("fb").innerHTML=`
    <div class="verdict ${correct?"ok":"ng"}">${correct?"○ 正解":"× 不正解"}</div>
    <div class="expl">${esc(q[3])}</div>
    <button class="primary" onclick="nextQ()">${quiz.i+1<quiz.list.length?"次の問題へ":"結果を見る"}</button>`;
}
function nextQ(){quiz.i++;quiz.i<quiz.list.length?renderQ():showResult()}
function confirmQuit(){if(confirm("中断してホームに戻りますか？(この回の成績は保存されません)"))home()}
function showResult(){
  const n=quiz.list.length, ok=quiz.ok;
  let passHtml="";
  if(quiz.mode==="mock"){
    const p=quiz.okLaw>=8&&quiz.okEng>=8;
    passHtml=`<p style="text-align:center;margin:6px 0">法規 ${quiz.okLaw}/12　工学 ${quiz.okEng}/12</p>
    <p class="${p?"pass":"fail"}">${p?"合格ライン到達！（各科目8問以上）":"不合格（各科目8問以上で合格）"}</p>`;
  }
  records.push({d:new Date().toLocaleDateString("ja-JP"),t:quiz.title,s:ok,n});
  if(records.length>60)records=records.slice(-60);
  save(RKEY,records);
  app.innerHTML=`
  <div class="card">
    <h2 style="margin-top:0">${esc(quiz.title)} 結果</h2>
    <div class="score-big">${ok} <span style="font-size:16px;color:var(--sub)">/ ${n}問</span></div>
    ${passHtml}
    ${quiz.wrongNow.length?`<button class="secondary" style="margin-top:10px" onclick="startQuiz([${quiz.wrongNow}],'今回の間違い直し','drill')">今回の間違い ${quiz.wrongNow.length}問をすぐ復習</button>`:`<p class="pass">全問正解！</p>`}
    <button class="primary" style="margin-top:8px" onclick="home()">ホームへ戻る</button>
  </div>`;
}

  <p class="note">試験の電気通信術は欧文（A〜Z）の受話・送話。速度は1分間50字・約2分間（計約100字＝5字区切り×20語）です。</p>`;

  <div class="ph-grid">${PHON.map(p=>`<div class="ph-cell"><b>${p[0]}</b>${p[1]}</div>`).join("")}</div>
  <button class="secondary" style="margin-top:12px" onclick="speakSeq('ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split(''),1)">A〜Zを通しで聴く</button>`;
}
let phonAns="";
function randLetters(n){let s="";for(let i=0;i<n;i++)s+=String.fromCharCode(65+Math.floor(Math.random()*26));return s}
function speakSeq(chars,rate){
  const sep=rate<=0.8?". ":", ";
  const words=chars.map(c=>SPEAK[c]||c).join(sep);
  const go=()=>{
    const u=new SpeechSynthesisUtterance(words);
    u.lang="en-US";u.rate=rate;u.volume=1;
    try{const v=speechSynthesis.getVoices().find(v=>/^en[-_]/i.test(v.lang));if(v)u.voice=v}catch(e){}
    speechSynthesis.speak(u);
    try{speechSynthesis.resume()}catch(e){}
  };
  if(speechSynthesis.speaking||speechSynthesis.pending){speechSynthesis.cancel();setTimeout(go,150)}
  else go();
}
try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>{try{speechSynthesis.getVoices()}catch(e){}}}catch(e){}
let plTimer=null;
function sayOne(c){
  const u=new SpeechSynthesisUtterance(SPEAK[c]||c);
  u.lang="en-US";u.rate=1;u.volume=1;
  try{const v=speechSynthesis.getVoices().find(v=>/^en[-_]/i.test(v.lang));if(v)u.voice=v}catch(e){}
  speechSynthesis.speak(u);
  try{speechSynthesis.resume()}catch(e){}
}
function pacedSpeak(chars,interval){
  stopPaced();
  let i=0;
  sayOne(chars[i++]);
  if(i<chars.length)plTimer=setInterval(()=>{
    if(i>=chars.length){clearInterval(plTimer);plTimer=null;return}
    sayOne(chars[i++]);
  },interval*1000);
}
function stopPaced(){
  if(plTimer){clearInterval(plTimer);plTimer=null}
  speechSynthesis.cancel();
}
function phonListen(){
  app.innerHTML=`<button class="back" onclick="phonMenu()">← 戻る</button>

      <div><label class="f">ペース（1字あたり）</label><select id="pl-r"><option value="2">ゆっくり（2秒）</option><option value="1.2" selected>本番（1.2秒）</option><option value="1">速い（1秒）</option></select></div>
    </div>
    <button class="primary" onclick="phonPlay()">出題して再生 ▶</button>
    <div class="row">

      <button class="secondary" onclick="stopPaced()">停止</button>
    </div>
    <label class="f" style="margin-top:8px">聴き取った文字を入力</label>
    <input type="text" id="pl-in" autocomplete="off" autocapitalize="characters">
    <button class="primary" style="margin-top:8px" onclick="phonCheck()">答え合わせ</button>
    <div id="pl-res"></div>
  </div>
  <p class="note">音声はブラウザの読み上げ機能（英語音声）を使用します。音が出ない場合は、①iPhone本体横の消音スイッチ（マナーモード）を解除 ②音量を上げる ③再生ボタンを押し直す、を試してください。</p>`;
}
function phonPlay(){
  phonAns=randLetters(parseInt($("pl-n").value));
  $("pl-in").value="";$("pl-res").innerHTML="";
  pacedSpeak(phonAns.split(""),parseFloat($("pl-r").value));
}
function phonReplay(){if(phonAns)pacedSpeak(phonAns.split(""),parseFloat($("pl-r").value))}
function phonCheck(){
  if(!phonAns){$("pl-res").innerHTML=`<p class="note">先に「出題して再生」を押してください。</p>`;return}
  const inp=$("pl-in").value.toUpperCase().replace(/[^A-Z]/g,"");
  let html="",ok=0;
  for(let i=0;i<phonAns.length;i++){
    const c=phonAns[i],g=inp[i]||"·";
    if(c===g){ok++;html+=`<span class="diff-ok">${c}</span>`}
    else html+=`<span class="diff-ng">${c}</span>`;
  }
  $("pl-res").innerHTML=`<div class="verdict ${ok===phonAns.length?"ok":"ng"}">${ok} / ${phonAns.length}字 正解</div>
  <p style="font-size:13px;color:var(--sub)">正解（赤＝ミス箇所）:</p>
  <div style="font-size:20px;letter-spacing:.25em;word-break:break-all">${html}</div>
  ${inp.length!==phonAns.length?`<p class="note">入力字数（${inp.length}字）が出題数と違います。</p>`:""}`;
}
/* ---- 送話練習（制限時間＋音声認識による読み判定） ---- */
const VOICE={A:["alpha","alfa"],B:["bravo"],C:["charlie","charley"],D:["delta"],E:["echo"],F:["foxtrot","fox trot"],G:["golf","gulf"],H:["hotel"],I:["india"],J:["juliet","juliett","juliette","julia"],K:["kilo"],L:["lima"],M:["mike","mic"],N:["november"],O:["oscar"],P:["papa","poppa"],Q:["quebec"],R:["romeo"],S:["sierra"],T:["tango"],U:["uniform"],V:["victor"],W:["whiskey","whisky"],X:["x ray","xray","exray"],Y:["yankee","yanky"],Z:["zulu"]};
let sp={running:false};
function stopRec(){
  if(typeof plTimer!=="undefined"&&plTimer){clearInterval(plTimer);plTimer=null}
  if(sp.int)clearInterval(sp.int);
  sp.running=false;
  if(sp.rec){try{sp.rec.onend=null;sp.rec.stop()}catch(e){}}
  killAudioRec();
}
const spRec={mr:null,stream:null,chunks:[],url:null};
function startAudioRec(){
  try{
    if(!navigator.mediaDevices||!window.MediaRecorder)return;
    navigator.mediaDevices.getUserMedia({audio:true}).then(st=>{
      spRec.stream=st;spRec.chunks=[];
      const mr=new MediaRecorder(st);spRec.mr=mr;
      mr.ondataavailable=e=>{if(e.data&&e.data.size)spRec.chunks.push(e.data)};
      mr.start();
    }).catch(()=>{});
  }catch(e){}
}
function stopAudioRec(cb){
  try{
    if(spRec.mr&&spRec.mr.state!=="inactive"){
      spRec.mr.onstop=()=>{
        try{
          const b=new Blob(spRec.chunks,{type:spRec.mr.mimeType||"audio/mp4"});
          if(spRec.url)URL.revokeObjectURL(spRec.url);
          spRec.url=spRec.chunks.length?URL.createObjectURL(b):null;
        }catch(e){spRec.url=null}
        if(spRec.stream)spRec.stream.getTracks().forEach(t=>t.stop());
        spRec.mr=null;spRec.stream=null;
        if(cb)cb();
      };
      spRec.mr.stop();
    }else{
      if(spRec.stream)spRec.stream.getTracks().forEach(t=>t.stop());
      spRec.mr=null;spRec.stream=null;
      if(cb)cb();
    }
  }catch(e){if(cb)cb()}
}
function killAudioRec(){
  try{
    if(spRec.mr&&spRec.mr.state!=="inactive"){spRec.mr.onstop=null;spRec.mr.stop()}
    if(spRec.stream)spRec.stream.getTracks().forEach(t=>t.stop());
    spRec.mr=null;spRec.stream=null;
  }catch(e){}
}
function lev(a,b){
  const m=a.length,n=b.length,d=[];
  for(let i=0;i<=m;i++)d[i]=[i];for(let j=0;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
function tokMatch(ch,toks,i){
  for(const v of (VOICE[ch]||[])){
    const parts=v.split(" ");let ok=true;
    for(let k=0;k<parts.length;k++){
      const t=toks[i+k],p=parts[k];
      if(!t){ok=false;break}
      if(t===p)continue;
      if(p.length>=4&&lev(t,p)<=1)continue;
      ok=false;break;
    }
    if(ok)return parts.length;
  }
  return 0;
}
function phonSpeak(){
  speechSynthesis.cancel();stopRec();
  app.innerHTML=`<button class="back" onclick="phonMenu()">← 戻る</button>
  <h2>送話練習</h2>
  <div class="card">
    <div class="row">
      <div><label class="f">文字数</label><select id="sp-n"><option value="5">5字</option><option value="10" selected>10字</option><option value="25">25字（30秒相当）</option><option value="50">50字（1分相当）</option><option value="100">100字（試験と同量・2分）</option></select></div>
      <div><label class="f">ペース（1字あたり）</label><select id="sp-r"><option value="2">ゆっくり（2秒）</option><option value="1.2" selected>本番（1.2秒）</option><option value="1">速い（1秒）</option></select></div>
    </div>
    <div style="margin-top:8px"><label class="f">判定方法</label><select id="sp-m"><option value="rec" selected>音声認識で自動判定（マイク使用）</option><option value="self">自己チェック採点（マイクなし）</option></select></div>
    <button class="primary" style="margin-top:10px" onclick="spStart()">開始する</button>
  </div>
  <p class="note">※自動判定は初回にマイクの許可が必要です（iPhoneの音声入力がオフだと動かないことがあります）。使えない環境では「自己チェック採点」に自動で切り替わります。自己チェック採点では読み上げを自動録音し（マイク許可時）、聞き返しながら○×をつけられます。録音は端末内のみで保存されません。<br>※お手本の音が出ないときは、本体横の消音スイッチ（マナーモード）解除と音量アップを確認してください。</p>`;
}
function spStart(){
  sp.n=parseInt($("sp-n").value);sp.pace=parseFloat($("sp-r").value);
  sp.selfMode=$("sp-m")&&$("sp-m").value==="self";
  spBegin(randLetters(sp.n));
}
function spAgain(){spBegin(sp.letters)}
function spNew(){spBegin(randLetters(sp.n))}
function spBegin(letters){
  speechSynthesis.cancel();stopRec();
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  sp.letters=letters;sp.limit=Math.ceil(sp.n*sp.pace);sp.heard="";sp.interim="";
  if(sp.selfMode){spFallback();return}
  if(!SR){spFallback("この環境では音声認識を利用できないため、自己チェック方式で行います。");return}
  app.innerHTML=`<button class="back" onclick="phonSpeak()">← 設定に戻る（中断）</button>
  <div class="card">
    <div class="qmeta"><span>読み上げ中</span><span id="sp-time">${sp.limit}.0秒</span></div>
    <div class="bar"><i id="sp-bar" style="width:100%"></i></div>
    <div class="big-letters" style="font-size:${sp.n>25?"20px":"28px"};letter-spacing:.25em">${sp.letters}</div>
    <p class="note" id="sp-live">音声を認識しています…</p>
    <button class="primary" onclick="spFinish()">読み終わった（判定へ）</button>
  </div>`;
  sp.running=true;sp.end=Date.now()+sp.limit*1000;
  const rec=new SR();sp.rec=rec;
  rec.lang="en-US";rec.continuous=true;rec.interimResults=true;
  rec.onresult=e=>{
    let intr="";
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal)sp.heard+=" "+t;else intr+=" "+t;
    }
    sp.interim=intr;
    const el=$("sp-live");
    if(el){const s=(sp.heard+" "+intr).trim();el.textContent=s?("認識中: …"+s.slice(-50)):"音声を認識しています…"}
  };
  rec.onerror=e=>{
    if(!sp.running)return;
    const m={"not-allowed":"マイクの使用が許可されませんでした。","service-not-allowed":"この環境では音声認識を利用できません。","audio-capture":"マイクが見つかりません。","network":"音声認識サービスに接続できません。"};
    if(m[e.error]){stopRec();spFallback(m[e.error]+" 自己チェック方式に切り替えました。")}
  };
  rec.onend=()=>{if(sp.running){try{rec.start()}catch(e){}}};
  try{rec.start()}catch(e){spFallback("音声認識を開始できなかったため、自己チェック方式に切り替えました。");return}
  sp.int=setInterval(()=>{
    const rem=(sp.end-Date.now())/1000;
    if(rem<=0){spFinish();return}
    const t=$("sp-time"),b=$("sp-bar");
    if(t)t.textContent=rem.toFixed(1)+"秒";
    if(b){b.style.width=(rem/sp.limit*100)+"%";if(rem<5)b.style.background="var(--red)"}
  },100);
}
function spFinish(){
  if(!sp.running)return;
  sp.running=false;clearInterval(sp.int);
  if(sp.rec){try{sp.rec.onend=null;sp.rec.stop()}catch(e){}}
  setTimeout(spResult,500);
}
function spResult(){
  const heardText=(sp.heard+" "+sp.interim).trim();
  const toks=heardText.toLowerCase().replace(/[^a-z]+/g," ").trim().split(/\s+/).filter(Boolean);
  let p=0;const res=[];
  for(const ch of sp.letters){
    let hit=0,at=-1;
    for(let look=p;look<Math.min(p+3,toks.length);look++){
      const c=tokMatch(ch,toks,look);
      if(c){hit=c;at=look;break}
    }
    if(hit){res.push(true);p=at+hit}else res.push(false);
  }
  const ok=res.filter(Boolean).length,miss=sp.letters.split("").filter((c,i)=>!res[i]);
  records.push({d:new Date().toLocaleDateString("ja-JP"),t:"送話練習("+sp.n+"字)",s:ok,n:sp.n});
  if(records.length>60)records=records.slice(-60);
  save(RKEY,records);
  app.innerHTML=`<button class="back" onclick="phonSpeak()">← 設定に戻る</button>
  <div class="card">
    <h2 style="margin-top:0">送話 結果</h2>
    <div class="score-big">${ok} <span style="font-size:16px;color:var(--sub)">/ ${sp.n}字</span></div>
    <div style="font-size:22px;letter-spacing:.3em;word-break:break-all;text-align:center;margin:8px 0">${sp.letters.split("").map((c,i)=>`<span class="${res[i]?"diff-ok":"diff-ng"}">${c}</span>`).join("")}</div>
    ${miss.length?`<p style="font-size:13px;color:var(--sub);margin-top:6px">認識できなかった字の読み:</p>
    <div class="ph-grid">${[...new Set(miss)].map(c=>`<div class="ph-cell"><b>${c}</b>${PHON.find(x=>x[0]===c)[1]}</div>`).join("")}</div>
    <button class="secondary" style="margin-top:8px" onclick="speakSeq('${[...new Set(miss)].join("")}'.split(''),1)">ミスした字のお手本を聴く</button>`
    :`<p class="pass">全字認識されました！</p>`}
    <p class="note" style="margin-top:10px">認識された音声: ${heardText?esc(heardText):"（認識できませんでした）"}</p>
    <div class="row">
      <button class="secondary" onclick="spAgain()">同じ文字でもう一度</button>
      <button class="primary" onclick="spNew()">新しい文字で挑戦</button>
    </div>
  </div>
  <p class="note">×は音声認識で該当の語を拾えなかった字です。発音のほか、マイクや周囲の騒音、読む速さの影響も受けます。本番は誤字−3点・脱字−3点・冗字も減点。1字約1.2秒で淀みなく読み切る練習をしましょう。</p>`;
}
function spFallback(msg){
  app.innerHTML=`<button class="back" onclick="phonSpeak()">← 設定に戻る（中断）</button>
  ${msg?`<div class="card" style="border-color:var(--amber)">${esc(msg)}</div>`:""}
  <div class="card">
    <div class="qmeta"><span>読み上げ中（自己チェック方式）</span><span id="sp-time">${sp.limit}.0秒</span></div>
    <div class="bar"><i id="sp-bar" style="width:100%"></i></div>
    <div class="big-letters" style="font-size:${sp.n>25?"20px":"28px"};letter-spacing:.25em">${sp.letters}</div>
    <button class="primary" onclick="spFbDone()">読み終わった（答え合わせ）</button>
  </div>`;
  sp.running=true;sp.end=Date.now()+sp.limit*1000;
  startAudioRec();
  sp.int=setInterval(()=>{
    const rem=(sp.end-Date.now())/1000;
    if(rem<=0){spFbDone();return}
    const t=$("sp-time"),b=$("sp-bar");
    if(t)t.textContent=rem.toFixed(1)+"秒";
    if(b){b.style.width=(rem/sp.limit*100)+"%";if(rem<5)b.style.background="var(--red)"}
  },100);
}
function spFbDone(){
  if(!sp.running)return;
  sp.running=false;clearInterval(sp.int);
  sp.marks=sp.letters.split("").map(()=>true);
  stopAudioRec(()=>spFbMark());
}
function spFbMark(){
  app.innerHTML=`<button class="back" onclick="phonSpeak()">← 設定に戻る</button>
  <div class="card">
    <h2 style="margin-top:0">自己チェック採点</h2>
    <p style="font-size:13px;color:var(--sub)">正しく読めなかった字をタップして×にしてください（もう一度タップで○に戻ります）。</p>
    ${spRec.url?`<p style="font-size:12px;color:var(--cyan);margin:4px 0 2px">自分の読みを聞き返して採点：</p><audio controls src="${spRec.url}" style="width:100%;margin-bottom:8px"></audio>`:""}
    <div class="ph-grid">${sp.letters.split("").map((c,i)=>`<button class="ph-cell" style="text-align:left;border:1px solid ${sp.marks[i]?"var(--green)":"var(--red)"}" onclick="sp.marks[${i}]=!sp.marks[${i}];spFbMark()"><b>${c}</b>${PHON.find(x=>x[0]===c)[1]} <span style="float:right;font-weight:700;color:${sp.marks[i]?"var(--green)":"var(--red)"}">${sp.marks[i]?"○":"×"}</span></button>`).join("")}</div>
    <button class="secondary" style="margin-top:10px" onclick="speakSeq('${sp.letters}'.split(''),1)">全体のお手本を聴く</button>
    <button class="primary" style="margin-top:8px" onclick="spFbSave()">この採点で記録する</button>
  </div>
  <p class="note">目安：言い淀み・読み直し・1秒以上の詰まりがあった字は×にすると本番（誤字・脱字で減点）に近い採点になります。</p>`;
}
function spFbSave(){
  const ok=sp.marks.filter(Boolean).length,miss=sp.letters.split("").filter((c,i)=>!sp.marks[i]);
  records.push({d:new Date().toLocaleDateString("ja-JP"),t:"送話練習("+sp.n+"字)",s:ok,n:sp.n});
  if(records.length>60)records=records.slice(-60);
  save(RKEY,records);
  app.innerHTML=`<button class="back" onclick="phonSpeak()">← 設定に戻る</button>
  <div class="card">
    <h2 style="margin-top:0">送話 結果</h2>
    <div class="score-big">${ok} <span style="font-size:16px;color:var(--sub)">/ ${sp.n}字</span></div>
    <div style="font-size:22px;letter-spacing:.3em;word-break:break-all;text-align:center;margin:8px 0">${sp.letters.split("").map((c,i)=>`<span class="${sp.marks[i]?"diff-ok":"diff-ng"}">${c}</span>`).join("")}</div>
    ${miss.length?`<p style="font-size:13px;color:var(--sub);margin-top:6px">×にした字の読み:</p>
    <div class="ph-grid">${[...new Set(miss)].map(c=>`<div class="ph-cell"><b>${c}</b>${PHON.find(x=>x[0]===c)[1]}</div>`).join("")}</div>
    <button class="secondary" style="margin-top:8px" onclick="speakSeq('${[...new Set(miss)].join("")}'.split(''),1)">×の字のお手本を聴く</button>`
    :`<p class="pass">全字クリア！</p>`}
    <div class="row">
      <button class="secondary" onclick="spAgain()">同じ文字でもう一度</button>
      <button class="primary" onclick="spNew()">新しい文字で挑戦</button>
    </div>
  </div>
  <p class="note">本番は誤字−3点・脱字−3点・冗字も減点。1字約1.2秒で淀みなく読み切れるまで繰り返しましょう。</p>`;
}
home();
</script>
